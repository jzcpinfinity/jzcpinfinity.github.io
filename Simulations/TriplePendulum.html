<!DOCTYPE html>
<html>
<body>
    <body>
    <label><input type="checkbox" id="trailsToggle"> Show trails</label>
    <br>
	<canvas id = "TriplePendulum"></canvas>
<script>
    var lengths = [0.2, 0.2, 0.2];
    var masses = [1, 0.5, 0.5];
    var angles = [0.5*Math.PI, Math.PI, Math.PI];

    var canvas = document.getElementById("TriplePendulum");
	var c = canvas.getContext("2d");	
    canvas.width = window.innerWidth - 20;
    canvas.height = window.innerHeight - 20;
    var simMinWidth = 1.0;
	var cScale = Math.min(canvas.width, canvas.height) / simMinWidth;

	function cX(pos) { return canvas.width / 2 + pos.x * cScale; }
	function cY(pos) { return 0.4 * canvas.height - pos.y * cScale; }

    class Pendulum {
        constructor(lengths, masses, angles) {
            this.masses = [0.0];
            this.lengths = [0.0];
            this.pos = [{x: 0.0, y: 0.0}];
            this.prevPos = [{x: 0.0, y: 0.0}];
            this.vel = [{x: 0.0, y: 0.0}];
            this.trail = [];

            var x = 0.0, y = 0.0;
            for (var i = 0; i < lengths.length; i++) {
                this.masses.push(masses[i]);
                this.lengths.push(lengths[i]);
                x += lengths[i] * Math.sin(angles[i]);
                y -= lengths[i] * Math.cos(angles[i]);
                this.pos.push({x: x, y: y});
                this.prevPos.push({x: x, y: y});
                this.vel.push({x: 0, y: 0});
            }
        }

        simulate(dt, gravity) {
            var p = this;
            for (var i = 1; i < p.masses.length; i++) {
                p.vel[i].y += gravity * dt;
                p.prevPos[i].x = p.pos[i].x;
                p.prevPos[i].y = p.pos[i].y;
                p.pos[i].x += p.vel[i].x * dt;
                p.pos[i].y += p.vel[i].y * dt;
            }
            for (var i = 1; i < p.masses.length; i++) {
                var dx = p.pos[i].x - p.pos[i-1].x;
                var dy = p.pos[i].y - p.pos[i-1].y;
                var w0 = p.masses[i-1] > 0.0 ? 1.0 / p.masses[i-1] : 0.0;
                var w1 = p.masses[i] > 0.0 ? 1.0 / p.masses[i] : 0.0;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var diff = (dist - p.lengths[i]) / dist;
                p.pos[i].x -= (w1/(w0+w1)) * diff * dx;
                p.pos[i].y -= (w1/(w0+w1)) * diff * dy;
                p.pos[i-1].x += (w0/(w1+w0)) * diff * dx;
                p.pos[i-1].y += (w0/(w1+w0)) * diff * dy;
            }
            for (var i = 1; i < p.masses.length; i++) {
                p.vel[i].x = (p.pos[i].x - p.prevPos[i].x) / dt;
                p.vel[i].y = (p.pos[i].y - p.prevPos[i].y) / dt;
            }
        }

        draw() {
            var p = this;
            if (showTrails && p.trail.length > 1) {
                c.strokeStyle = "#FFD700";
                c.lineWidth = 2;
                c.beginPath();
                c.moveTo(cX(p.trail[0]), cY(p.trail[0]));
                for (var i = 1; i < p.trail.length; i++) {
                    c.lineTo(cX(p.trail[i]), cY(p.trail[i]));
                }
                c.stroke();
            }
            c.strokeStyle = "#303030";
            c.lineWidth = 10;
            c.beginPath();
            c.moveTo(cX(p.pos[0]), cY(p.pos[0]));
            for (var i = 1; i < p.masses.length; i++) 
                c.lineTo(cX(p.pos[i]), cY(p.pos[i]));
            c.stroke();
            c.lineWidth = 1;            

            c.fillStyle = "#FF0000";
            for (var i = 1; i < p.masses.length; i++) {
                var r = 0.025 * Math.sqrt(p.masses[i]);
                c.beginPath();			
                c.arc(cX(p.pos[i]), cY(p.pos[i]), cScale * r, 0.0, 2.0 * Math.PI); 
                c.closePath();
                c.fill();
            }
        }
        
        //drop the oldest point once the trail gets too long
        recordTrail(maxPoints) {
        var tip = this.pos[this.pos.length - 1];
        this.trail.push({x: tip.x, y: tip.y});
            if (this.trail.length > maxPoints) {
                this.trail.shift(); 
            }
        }
    }
    var scene = {
        gravity : -10.0,
        dt : 0.01,
        numSubSteps : 100,
        pendulums : [ new Pendulum(lengths, masses, angles) ]
    };

    function draw() {
        c.fillStyle = "#000000";
        c.fillRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < scene.pendulums.length; i++) {
            if (showTrails) {
                scene.pendulums[i].recordTrail(5000); 
            }
            scene.pendulums[i].draw();
        }
    }

    var showTrails = false;
    document.getElementById("trailsToggle").onchange = (e) => {
        showTrails = e.target.checked;
    };

    function simulate() {
        var sdt = scene.dt / scene.numSubSteps;
        for (var step = 0; step < scene.numSubSteps; step++) {
            for (var i = 0; i < scene.pendulums.length; i++) {
                scene.pendulums[i].simulate(sdt, scene.gravity);
            }
        }
    }

    function update() {
        simulate();
        draw();
        requestAnimationFrame(update);
    }

    update();
</script> 
</body>
</html>
