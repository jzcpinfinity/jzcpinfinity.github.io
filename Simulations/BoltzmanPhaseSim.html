<!DOCTYPE html>
<html>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<head>
		<title>Euler Fluid</title>
		<style>
			body {
				font-family: verdana; 
				font-size: 15px;
			}			
			.button {
				background-color: #606060;
				border: none;
				color: white;
				padding: 10px 10px;
				font-size: 16px;
				margin: 4px 2px;
				cursor: pointer;
			}
			.slider {
				-webkit-appearance: none;
				width: 80px;
				height: 6px;
				border-radius: 5px;
				background: #d3d3d3;
				outline: none;
				opacity: 0.7;
				-webkit-transition: .2s;
				transition: opacity .2s;
			}
		</style>
	</head>
	
<body>

	<div class="controls">
        <label>Temperature (T): <span id="tVal"></span></label>
        <input type="range" id="tSlider" min="0.5" max="4" step="0.01" value="2.0">

        <label>Chemical potential (&mu;): <span id="muVal"></span></label>
        <input type="range" id="muSlider" min="-3" max="-1" step="0.01" value="-2">

        <label>Liquid color: <input type="color" id="liquidColorPicker" value="#4682eb"></label>
        <label>Vapor color: <input type="color" id="vaporColorPicker" value="#f0f0f0"></label>

        <label>Pixel size: <input type="number" id="pixelSizeInput" min="1" max="50" step="1" value="3" style="width:50px;"></label>
        <label>Sim speed (&pixels updated per frame): <input type="number" id="simSpeedInput" min="0.01" max="1" step="0.01" value="0.1" style="width:60px;"></label>

        <span>&nbsp;&nbsp;&nbsp;&nbsp;p = pause/unpause</span>
    </div>
    <br>
    <canvas id="myCanvas" style="border:2px solid"></canvas>
	
<script>

	var canvas = document.getElementById("myCanvas");
	var c = canvas.getContext("2d");	
	canvas.width = window.innerWidth - 20;
	canvas.height = window.innerHeight - 100;

	canvas.focus();

	var simHeight = 1.1;	
	var cScale = canvas.height / simHeight;
	var simWidth = canvas.width / cScale;

	var cnt = 0;

	function cX(x) {
		return x * cScale;
	}

	function cY(y) {
		return canvas.height - y * cScale;
	}

	// start of Simulator
    //T = Temperature, numX = number of cells in x direction, numY = number of cells in y direction, mu = Chemical potential, J = Interaction strength
	class Fluid {
		constructor(T, numX, numY, mu, J) {
            this.T = T;
            this.numX = numX;
            this.numY = numY;
            this.mu = mu;
            this.J = J;

            this.state = new Uint8Array(numX * numY);
		}

        idx(i,j) {
            i = (i + this.numX) % this.numX;
            j = (j + this.numY) % this.numY;
            return j*this.numX +i;
        }

        neighborSum(i,j) {
            return this.state[this.idx(i-1,j)] + this.state[this.idx(i+1,j)] + this.state[this.idx(i,j-1)] + this.state[this.idx(i,j+1)];
        }

        CalculateEnergy() {
            let pairsum = 0;
            let occupied = 0;
            for(let i = 0; i < this.numX; i++) {
                for(let j = 0; j < this.numY; j++) {
                    const s = this.state[this.idx(i,j)];
                    energy += s*this.neighborSum(i,j)/2;
                    occupied += s;
                }
            }
            return this.J*pairsum -this.mu*occupied;
        }    

        FlipEnergyDifference(i,j) {
            const s = this.state[this.idx(i, j)];
            const n = this.neighborSum(i, j);

            // if s=0: diff = J*n + mu
            // if s=1: diff = -(J*n + mu)
            const energyDifference = (1 - 2 * s) * (this.J * n + this.mu);
            return energyDifference;
        }    

        Flip(){
            const i = (Math.random() * this.numX) | 0;
            const j = (Math.random() * this.numY) | 0;
            
            const energyDifference = this.FlipEnergyDifference(i, j);
            const q = Math.exp(energyDifference / this.T);
            const chanceOfFlip = q / (1 + q);

            if(Math.random() < chanceOfFlip){
                this.state[this.idx(i,j)] = 1 - this.state[this.idx(i,j)];
            }
        }

        Sweep(numSteps){
            for(let i =0; i < numSteps; i++){
                this.Flip();
            }    
        }
	}

	//  
    var scene = {
        paused: false,
        sweepsPerFrame: 0,
        lattice: null
    }
    var colors = {
        liquid: [70, 130, 235],
        vapor:  [240, 240, 240]
    };

    function hexToRgb(hex) {
        var n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    document.getElementById("liquidColorPicker").oninput = (e) => {
        colors.liquid = hexToRgb(e.target.value);
    };
    document.getElementById("vaporColorPicker").oninput = (e) => {
        colors.vapor = hexToRgb(e.target.value);
    };
    function setupScene() {
        var cellPx = parseInt(document.getElementById("pixelSizeInput").value);
        var simSpeed = parseFloat(document.getElementById("simSpeedInput").value);
        var numX = Math.floor(canvas.width / cellPx);
        var numY = Math.floor(canvas.height / cellPx);
        var T = 2.0;    
        var mu = 0.0;
        var J = 1.5;

        scene.lattice = new Fluid(T, numX, numY, mu, J);
        scene.sweepsPerFrame = Math.floor(numX * numY * simSpeed);

        // scene.lattice.state.fill(0);
        for(let k = 0; k < scene.lattice.state.length; k++){
            scene.lattice.state[k] = Math.random() < 0.5 ? 0 : 1;
        }
    }
	function setColor(r,g,b) {
		c.fillStyle = `rgb(
			${Math.floor(255*r)},
			${Math.floor(255*g)},
			${Math.floor(255*b)})`
		c.strokeStyle = `rgb(
			${Math.floor(255*r)},
			${Math.floor(255*g)},
			${Math.floor(255*b)})`
	}
    function draw() {
        c.clearRect(0, 0, canvas.width, canvas.height);

        var f = scene.lattice;
        var cellPx = canvas.width / f.numX;

        var id = c.createImageData(canvas.width, canvas.height);
        var data = id.data;

        for (let i = 0; i < f.numX; i++) {
            var px0 = Math.floor(i * cellPx);
            var px1 = Math.floor((i + 1) * cellPx);

            for (let j = 0; j < f.numY; j++) {
                var py0 = Math.floor(j * cellPx);
                var py1 = Math.floor((j + 1) * cellPx);

                var occupied = f.state[f.idx(i, j)] === 1;
                var col = occupied ? colors.liquid : colors.vapor;
                var r = col[0], g = col[1], b = col[2];
                for (let y = py0; y < py1; y++) {
                    var rowStart = (y * canvas.width + px0) * 4;
                    for (let x = px0; x < px1; x++) {
                        var p = rowStart + (x - px0) * 4;
                        data[p]     = r;
                        data[p + 1] = g;
                        data[p + 2] = b;
                        data[p + 3] = 255;
                    }
                }
            }
        }

        c.putImageData(id, 0, 0);
    }

    function syncUI() {
        document.getElementById("tVal").textContent = scene.lattice.T.toFixed(2);
        document.getElementById("muVal").textContent = scene.lattice.mu.toFixed(2);
    }

    document.getElementById("tSlider").oninput = (e) => {
        scene.lattice.T = parseFloat(e.target.value);
        syncUI();
    };
    document.getElementById("muSlider").oninput = (e) => {
        scene.lattice.mu = parseFloat(e.target.value);
        syncUI();
    };

    document.getElementById("pixelSizeInput").oninput = () => {
        setupScene();
        syncUI();
    };

    document.getElementById("simSpeedInput").oninput = () => {
        var simSpeed = parseFloat(document.getElementById("simSpeedInput").value);
        scene.sweepsPerFrame = Math.floor(scene.lattice.numX * scene.lattice.numY * simSpeed);
    };

	document.addEventListener('keydown', event => {
		switch(event.key) {
			case 'p': scene.paused = !scene.paused; break;
			case 'm': scene.paused = false; simulate(); scene.paused = true; break;
		}
	});

	function toggleStart()
	{
		var button = document.getElementById('startButton');
		if (scene.paused)
			button.innerHTML = "Stop";
		else
			button.innerHTML = "Start";
		scene.paused = !scene.paused;
	}

	// main
	function simulate() {
        if (!scene.paused){
            scene.lattice.Sweep(scene.sweepsPerFrame);
            console.log("step");
        }
    }

	function update() {
		simulate();
		draw();
		requestAnimationFrame(update);
	}
	
	setupScene();
    syncUI();
    update();
</script> 
</body>
</html>
